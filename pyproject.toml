[project]
name = "fluxo-niteroi"
version = "0.1.0"
description = "Coletor de fluxo de veículos a partir das câmeras públicas da NitTrans"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Labs.fanara.com.br" }]
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "lap>=0.5.14",
    "ultralytics>=8.3",
    # PyTorch com CUDA para a RTX 3050: o driver 577 suporta CUDA até 12.9, e a última
    # versão publicada para CUDA 12.6 é a 2.14 (a 2.15 só existe para CPU ou CUDA mais novo).
    "torch>=2.14,<2.15",
    "torchvision",
]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP"]
ignore = ["E501", "S101", "S310", "S608"]  # URL e SQL são constantes do próprio código

[tool.pytest.ini_options]
testpaths = ["."]
norecursedirs = ["painel", ".venv"]
addopts = "--cov=coletor --cov=validar --cov=exportar --cov=incidentes --cov=antes_depois --cov=historia --cov=sinistros --cov-report=term-missing"

[tool.ruff]
line-length = 100
extend-exclude = ["painel"]
