    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "inLanguage": "pt-BR",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "O que é o Fluxo Niterói?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "É um estudo cívico que conta automaticamente os veículos que passam pela Av. Jansen de Melo, na saída da Ponte Rio–Niterói, usando os vídeos públicos das câmeras da NitTrans. O objetivo é localizar o gargalo do trecho com dados e testar correções em simulação antes de propô-las à prefeitura."
            }
          },
          {
            "@type": "Question",
            "name": "De onde vêm os dados?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Das câmeras de videomonitoramento que a NitTrans publica na internet. A cada minuto o sistema baixa o último clipe de cada câmera, conta os veículos que cruzam uma linha fixa na imagem e guarda apenas os números."
            }
          },
          {
            "@type": "Question",
            "name": "Os números já são confiáveis?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Ainda não. A contagem automática está sendo conferida contra contagem manual às cegas, por câmera e por condição de luz e trânsito. Até essa validação terminar, os números servem para acompanhar o estudo, não como resultado."
            }
          },
          {
            "@type": "Question",
            "name": "O sistema guarda imagens ou placas?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Não. O vídeo é apagado logo depois da contagem e só os números ficam no banco. O sistema não lê placas nem identifica pessoas."
            }
          },
          {
            "@type": "Question",
            "name": "Por que às vezes o painel diz que a coleta está pausada?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "A coleta roda em um notebook pessoal. Quando ele está desligado ou ocupado, o painel mostra o horário do último clipe analisado e os gráficos ficam com um intervalo sem dados."
            }
          },
          {
            "@type": "Question",
            "name": "O projeto tem relação com a prefeitura?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Não. É um estudo independente feito por um morador de Niterói. A intenção é levar os resultados validados à NitTrans e à prefeitura como contribuição."
            }
          }
        ]
      }
    </script>
